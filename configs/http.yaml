# Optional go-atlas HTTP server for internal/observability endpoints.
# Disabled by default: with no `http` section the server never starts.
# Uncomment to enable ping/healthz/readyz/metrics and (opt-in) pprof.
# Built-in endpoints are served under the internal prefix (default /internal).
# All parameters are commented out by default (template mode).
#
# A non-loopback listenAddress is fail-closed on the same two flags as
# grpcWebAddress: allowRemote (env ALLOW_REMOTE) AND allowInsecure (env
# ALLOW_INSECURE) must both be set, since this listener has no basic-auth
# option of its own. pprof is additionally force-disabled on a non-loopback
# bind regardless of pprof.enabled or allowInsecure — it leaks heap
# contents, goroutine stacks, and cmdline, and nothing here authenticates it.

# http:
#   # Bind to loopback: the endpoints expose runtime internals and are
#   # unauthenticated. go-atlas defaults this to 0.0.0.0:9080 — override it.
#   listenAddress: "127.0.0.1:9080"   # (go-atlas default: 0.0.0.0:9080)
#
#   pprof:
#     # Exposes net/http/pprof under /internal/pprof/* (heap, goroutine, CPU,
#     # trace, ...). Privileged: keep the listener on loopback only.
#     enabled: true                   # (default: false)
