# Secret vault configuration for the natscope service.
# Secrets (NATS credentials, TLS keys, git tokens) never touch the database —
# they live in a dedicated vault. All parameters are commented out by default
# (template mode): the values shown are the built-in defaults.

#secrets:
#  # <string> Vault backend. One of:
#  #   auto    — probe the OS keychain, fall back to the encrypted file vault
#  #             when no keychain is usable (headless Linux, containers);
#  #   keyring — OS keychain only (macOS Keychain, Windows Credential Manager,
#  #             Linux Secret Service via D-Bus);
#  #   file    — AES-256-GCM-encrypted file vault under the data dir
#  #             (<dataDir>/secrets.vault; auto-generated key in
#  #             <dataDir>/vault.key, both user-only). Keep both files private:
#  #             whoever has them can read the stored secrets.
#  #             For real at-rest protection, supply the key out-of-band via the
#  #             SECRETS__FILE_KEY env var (64 hex chars = AES-256); then no
#  #             vault.key is written. Without it the co-located vault.key is
#  #             obfuscation only, not encryption at rest.
#  # Env: SECRETS__BACKEND
#  # Default value: auto
#  backend: auto
