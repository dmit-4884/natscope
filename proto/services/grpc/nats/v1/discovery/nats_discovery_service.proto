syntax = "proto3";
package natscope.nats.discovery.v1;
option go_package = "github.com/dmit-4884/natscope/proto/gen/services/grpc/nats/v1/discovery;grpc_nats_discovery";

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "types/nats/nats_access.proto";
import "types/nats/nats_micro.proto";

// Discovers NATS Micro services through the $SRV control subjects.
service DiscoveryService {
  // Lists the NATS Micro services answering $SRV.INFO, with $SRV.STATS statistics when the user may read them.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {}
}

// Defines the request message for listing NATS Micro services.
message ListServicesRequest {
  // Required. Identifier of the NATS connection to discover services through.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

// Defines the response message for listing NATS Micro services.
message ListServicesResponse {
  // Required. Whether the user may ask services for their info ($SRV.INFO); services stay empty when denied.
  .natscope.types.nats.AccessCheck info_access = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Whether the user may read service statistics ($SRV.STATS); unset when info access was denied.
  optional .natscope.types.nats.AccessCheck stats_access = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Discovered services, sorted by name.
  repeated .natscope.types.nats.MicroService services = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
