syntax = "proto3";
package natscope.nats.streams.v1;
option go_package = "github.com/dmit-4884/natscope/proto/gen/services/grpc/nats/v1/streams;grpc_nats_streams";

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "types/nats/nats_stream.proto";

// Provides read-only access to JetStream streams for a given NATS connection.
service StreamsService {
  // Returns all JetStream streams available on the specified connection.
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse) {}

  // Returns the names of all JetStream streams on the specified connection, sorted by name.
  // Much cheaper than ListStreams: the server pages names 1024 at a time instead of full stream info.
  rpc ListStreamNames(ListStreamNamesRequest) returns (ListStreamNamesResponse) {}

  // Returns detailed information about a single JetStream stream.
  rpc GetStream(GetStreamRequest) returns (GetStreamResponse) {}

  // Returns the relations graph of the connection's streams: which streams source, mirror or
  // republish into which. Streams without any relation are left out.
  rpc GetStreamRelations(GetStreamRelationsRequest) returns (GetStreamRelationsResponse) {}
}

// Defines the request message for listing JetStream streams.
message ListStreamsRequest {
  // Required. Identifier of the NATS connection to query streams from.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

// Defines the response message for listing JetStream streams.
message ListStreamsResponse {
  // Required. List of JetStream stream information objects.
  repeated .natscope.types.nats.StreamInfo streams = 1;
}

// Defines the request message for listing JetStream stream names.
message ListStreamNamesRequest {
  // Required. Identifier of the NATS connection to query stream names from.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

// Defines the response message for listing JetStream stream names.
message ListStreamNamesResponse {
  // Required. Stream names, sorted by name.
  repeated string names = 1;
}

// Defines the request message for getting a single JetStream stream.
message GetStreamRequest {
  // Required. Identifier of the NATS connection to query.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];

  // Required. Name of the JetStream stream to retrieve.
  string stream_name = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}

// Defines the response message for getting a single JetStream stream.
message GetStreamResponse {
  // Required. Detailed information about the requested stream.
  .natscope.types.nats.StreamInfo stream = 1;
}

// Defines the request message for getting the stream relations graph.
message GetStreamRelationsRequest {
  // Required. Identifier of the NATS connection to query.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

// Defines the response message for getting the stream relations graph.
message GetStreamRelationsResponse {
  // Required. Streams and placeholders taking part in at least one relation, sorted by id.
  repeated .natscope.types.nats.StreamRelationNode nodes = 1;

  // Required. Relations, each pointing from the upstream node to the downstream one.
  repeated .natscope.types.nats.StreamRelationEdge edges = 2;
}
