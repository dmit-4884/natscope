syntax = "proto3";
package natscope.nats.messages.v1;
option go_package = "github.com/dmit-4884/natscope/proto/gen/services/grpc/nats/v1/messages;grpc_nats_messages";

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "types/nats/nats_message.proto";

// Provides access to JetStream messages with server-side protobuf decoding support.
service MessagesService {
  // Returns a paginated list of messages from a JetStream stream with optional subject filtering and direction control.
  // Pagination: Cursor-based.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {}

  // Returns a single message from a JetStream stream by its sequence number.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse) {}

  // Returns the first message at or after a sequence whose subject matches one of the filters.
  // Reads the stream directly, so no consumer state changes.
  rpc GetNextMessage(GetNextMessageRequest) returns (GetNextMessageResponse) {}

  // Searches a whole stream on the server, streaming progress and matches until the range ends or a budget runs out.
  // Closing the stream stops the search.
  rpc SearchMessages(SearchMessagesRequest) returns (stream SearchMessagesResponse) {}
}

// Defines the direction for sequential message retrieval.
enum Direction {
  // Default value. The server decides the direction.
  DIRECTION_UNSPECIFIED = 0;

  // Retrieve messages in ascending sequence order (oldest first).
  DIRECTION_FORWARD = 1;

  // Retrieve messages in descending sequence order (newest first).
  DIRECTION_BACKWARD = 2;
}

// Defines the request message for listing JetStream messages.
message ListMessagesRequest {
  // start_seq and start_time both pick the first message of the page and so
  // are mutually exclusive — the server resolves start_time to a sequence and
  // would have no consistent way to honor an explicit start_seq as well.
  option (buf.validate.message).cel = {
    id: "natscope.nats.messages.start_seq_xor_start_time"
    message: "start_seq and start_time are mutually exclusive"
    expression: "!(has(this.start_seq) && has(this.start_time))"
  };

  // Required. Identifier of the NATS connection to read messages from.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];

  // Required. Name of the JetStream stream to read messages from.
  string stream_name = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];

  // Optional. NATS subject filter to narrow results. Supports wildcards (* and >).
  optional string subject_filter = 3;

  // Optional. Direction of message retrieval. Defaults to DIRECTION_UNSPECIFIED.
  Direction direction = 4;

  // Optional. Starting sequence number for cursor-based pagination.
  optional uint64 start_seq = 5;

  // Optional. Maximum number of messages to return per page.
  optional int64 limit = 6;

  reserved 7;
  reserved "content_filter";

  // Optional. When > 0, truncate each message's `data` (and decoded JSON) to
  // this many bytes for the list view. The original byte count is preserved
  // in NatsMessage.dataSize and NatsMessage.truncated is set so the UI can
  // render a "load full payload" affordance that calls Get(sequence). When 0
  // or omitted, the server falls back to user settings
  // (Messages.maxPayloadBytesInList); 0 disables truncation.
  optional int32 max_payload_bytes = 8;

  // Optional. Jump to the first message at or after this publish time. The
  // server resolves it to a starting sequence (honoring the user's
  // fetch_method: binary search for "direct", a DeliverByStartTime consumer
  // for "consumer") and then pages from there. Mutually exclusive with
  // start_seq.
  optional google.protobuf.Timestamp start_time = 9;
}

// Defines the response message for listing JetStream messages.
message ListMessagesResponse {
  // Required. List of NATS messages, optionally decoded from protobuf if a mapping exists.
  repeated .natscope.types.nats.NatsMessage messages = 1;

  // Required. Indicates whether additional messages are available beyond this page.
  bool has_more = 2;

  // Required. Sequence number to use as startSeq for fetching the next page.
  uint64 next_seq = 3;
}

// Defines the request message for getting a single JetStream message.
message GetMessageRequest {
  // Required. Identifier of the NATS connection to read the message from.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];

  // Required. Name of the JetStream stream containing the message.
  string stream_name = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];

  // Required. Sequence number of the message to retrieve.
  uint64 sequence = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).uint64.gt = 0];
}

// Defines the response message for getting a single JetStream message.
message GetMessageResponse {
  // Required. The requested NATS message, optionally decoded from protobuf if a mapping exists.
  .natscope.types.nats.NatsMessage message = 1;
}

// Defines the request message for finding the next matching JetStream message.
message GetNextMessageRequest {
  // Required. Identifier of the NATS connection to read the message from.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];

  // Required. Name of the JetStream stream to search.
  string stream_name = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];

  // Required. Sequence number to start the search at, inclusive.
  uint64 start_seq = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).uint64.gt = 0];

  // Optional. Subject filters, wildcards allowed; empty matches every subject.
  repeated string subjects = 4 [(buf.validate.field).repeated = {
    max_items: 64
    items: {string: {min_len: 1}}
  }];
}

// Defines the response message for finding the next matching JetStream message.
message GetNextMessageResponse {
  // Optional. The first matching message, decoded like GetMessage; unset when nothing matches.
  optional .natscope.types.nats.NatsMessage message = 1;
}

// Defines the request message for searching a JetStream stream.
message SearchMessagesRequest {
  option (buf.validate.message).cel = {
    id: "natscope.nats.messages.search_seq_range"
    message: "from_seq must not be above to_seq"
    expression: "!has(this.from_seq) || !has(this.to_seq) || this.from_seq <= this.to_seq"
  };
  option (buf.validate.message).cel = {
    id: "natscope.nats.messages.search_time_range"
    message: "from_time must not be after to_time"
    expression: "!has(this.from_time) || !has(this.to_time) || this.from_time <= this.to_time"
  };
  option (buf.validate.message).cel = {
    id: "natscope.nats.messages.search_header_value_needs_name"
    message: "header_value needs header_name"
    expression: "this.header_value == '' || this.header_name != ''"
  };

  // Required. Identifier of the NATS connection to search through.
  string connection_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.uuid = true];

  // Required. Name of the JetStream stream to search.
  string stream_name = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];

  // Optional. Subject filter, wildcards allowed; the NATS server applies it.
  optional string subject_filter = 3;

  // Optional. Search order. Defaults to the user's list direction.
  Direction direction = 4;

  // Optional. Lowest sequence to search, inclusive.
  optional uint64 from_seq = 5 [(buf.validate.field).uint64.gt = 0];

  // Optional. Highest sequence to search, inclusive.
  optional uint64 to_seq = 6 [(buf.validate.field).uint64.gt = 0];

  // Optional. Earliest publish time to search, inclusive.
  optional google.protobuf.Timestamp from_time = 7;

  // Optional. Latest publish time to search, inclusive.
  optional google.protobuf.Timestamp to_time = 8;

  // Optional. Resumes a previous run at the next_seq its SearchDone returned.
  optional uint64 cursor_seq = 9 [(buf.validate.field).uint64.gt = 0];

  // Optional. Text the decoded or raw payload must contain, case-insensitive; with regex, an RE2 expression.
  string text = 10 [(buf.validate.field).string.max_len = 1024];

  // Optional. Treats text as an RE2 regular expression, matched as written.
  bool regex = 11;

  // Optional. Header the message must carry, matched without regard to case.
  string header_name = 12 [(buf.validate.field).string.max_len = 256];

  // Optional. Value the header must have; empty means any value.
  string header_value = 13 [(buf.validate.field).string.max_len = 1024];

  // Optional. Caps each returned payload; unset uses the user's list setting, 0 disables the cap.
  optional int32 max_payload_bytes = 14 [(buf.validate.field).int32.gte = 0];
}

// Defines one event of a running search.
message SearchMessagesResponse {
  oneof event {
    // How far the search got.
    SearchProgress progress = 1;

    // Messages that matched since the previous batch.
    SearchMatches matches = 2;

    // The last event: why the run ended and where to continue.
    SearchDone done = 3;
  }
}

// Defines how far a running search got.
message SearchProgress {
  // Required. Messages read so far in this run.
  uint64 scanned = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Messages that matched so far in this run.
  uint64 matched = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Sequence of the last message read.
  uint64 current_seq = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Lowest sequence of the searched range.
  uint64 range_first_seq = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Highest sequence of the searched range.
  uint64 range_last_seq = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Cursor that continues a search stopped now without skipping or repeating a match; unset when nothing
  // is left. Every match before it has already been sent.
  optional uint64 resume_seq = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Defines a batch of matching messages.
message SearchMatches {
  // Required. Matching messages in search order.
  repeated .natscope.types.nats.NatsMessage messages = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Defines why a search run ended.
enum SearchStopReason {
  // Not set.
  SEARCH_STOP_REASON_UNSPECIFIED = 0;

  // The whole range was searched.
  SEARCH_STOP_REASON_COMPLETE = 1;

  // The run read as many messages as one run may.
  SEARCH_STOP_REASON_SCAN_LIMIT = 2;

  // The run took as long as one run may.
  SEARCH_STOP_REASON_TIME_LIMIT = 3;

  // The run found as many matches as one run returns.
  SEARCH_STOP_REASON_MATCH_LIMIT = 4;
}

// Defines the summary of a search run.
message SearchDone {
  // Required. Messages read in this run.
  uint64 scanned = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Messages that matched in this run.
  uint64 matched = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Why the run ended.
  SearchStopReason reason = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Lowest sequence of the searched range.
  uint64 range_first_seq = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Highest sequence of the searched range.
  uint64 range_last_seq = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Pass as cursor_seq with the same filters to continue; unset when the range is done.
  optional uint64 next_seq = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}
