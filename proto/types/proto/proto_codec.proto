syntax = "proto3";
package natscope.types.proto;
option go_package = "github.com/dmit-4884/natscope/proto/gen/types/proto;protopb";

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";

// Defines result of protobuf message decoding.
message DecodeResult {
  // Required. Decoded message content as JSON string.
  string data = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Fully-qualified protobuf message type that was used for decoding.
  string message_type = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Optional. Error message if decoding failed.
  optional string error = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Fields the payload carries but the schema does not declare.
  repeated UnknownField unknown_fields = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set when decoding failed but the first valid_bytes decoded into data.
  int32 valid_bytes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // No mapping matched; Natscope detected message_type.
  bool auto = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Proto source of message_type.
  string source_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Message type a payload decodes as.
message TypeCandidate {
  string source_id = 1;
  string source_revision = 2;
  string message_type = 3;
  // 0 to 100: mostly the share of bytes that decode as declared fields, plus how many of the fields are set.
  int32 score = 4;
  // Bytes of fields the type does not declare.
  int32 unknown_bytes = 5;
  // Payload decoded as this type, JSON.
  string decoded = 6;
}

// How a payload wraps its protobuf message.
enum FramingKind {
  FRAMING_KIND_UNSPECIFIED = 0;
  // 1-byte compression flag and 4-byte big-endian length; a set flag means gzip.
  FRAMING_KIND_GRPC = 1;
  // Confluent Schema Registry: magic byte, 4-byte schema id, message indexes.
  FRAMING_KIND_CONFLUENT = 2;
  // Varint length prefix, as written by writeDelimitedTo.
  FRAMING_KIND_VARINT_DELIMITED = 3;
  // Fixed bytes before and after the message.
  FRAMING_KIND_CUSTOM = 4;
}

// Wrapper around the protobuf message of a payload.
message Framing {
  FramingKind kind = 1;
  // Confluent schema id written on encode.
  int32 schema_id = 2 [(buf.validate.field).int32.gte = 0];
  // Custom framing bytes before the message.
  bytes prefix = 3 [(buf.validate.field).bytes.max_len = 64];
  // Custom framing bytes after the message.
  bytes suffix = 4 [(buf.validate.field).bytes.max_len = 64];
}

// How a field is encoded on the wire.
enum WireType {
  WIRE_TYPE_UNSPECIFIED = 0;
  WIRE_TYPE_VARINT = 1;
  WIRE_TYPE_FIXED64 = 2;
  WIRE_TYPE_BYTES = 3;
  WIRE_TYPE_GROUP = 4;
  WIRE_TYPE_FIXED32 = 5;
}

// Field the schema does not declare.
message UnknownField {
  // Path of the message holding it, e.g. "items[0].price"; empty for the top level.
  string path = 1;
  int32 number = 2;
  WireType wire_type = 3;
  // Bytes on the wire, tag included.
  int32 size = 4;
}

// Payload field read without a schema.
message WireField {
  int32 number = 1;
  WireType wire_type = 2;
  // Byte offset of the tag in the payload.
  int32 offset = 3;
  // Bytes on the wire, tag included.
  int32 length = 4;
  uint64 varint = 5;
  // Raw fixed32 or fixed64 value.
  uint64 fixed = 6;
  bytes bytes = 7;
  // Bytes as text when they are printable UTF-8.
  string text = 8;
  // Fields of bytes, or a group, that parse as a message.
  repeated WireField message = 9;
}

// Defines result of protobuf message encoding.
message EncodeResult {
  // Required. Encoded protobuf message as binary bytes.
  bytes data = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Size of the encoded message in bytes.
  int64 data_size = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Optional. Error message if encoding failed.
  optional string error = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Defines result of protobuf message validation.
message ValidationResult {
  // Required. Whether the message passes all validation rules.
  bool valid = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Repeated. List of validation violations found.
  repeated ValidationViolation violations = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Optional. Error message if validation could not be performed.
  optional string error = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Defines a single validation rule violation.
message ValidationViolation {
  // Required. Dot-separated path to the field that violated a rule.
  string field_path = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Identifier of the validation constraint that was violated.
  string constraint_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Human-readable description of the violation.
  string message = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
