syntax = "proto3";
package natscope.types.proto;
option go_package = "github.com/dmit-4884/natscope/proto/gen/types/proto;protopb";

import "google/api/field_behavior.proto";

// Defines metadata about a registered protobuf message type within a specific source snapshot.
message ProtoMessageInfo {
  // Required. Fully-qualified protobuf message name (e.g., "google.protobuf.Timestamp").
  string full_name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Path to the .proto file defining this message.
  string proto_file = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Protobuf package name.
  string package = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Repeated. List of fields defined in this message.
  repeated ProtoFieldInfo fields = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Identifier of the proto source that owns this message type.
  string source_id = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Active tag of the source snapshot ("local" for local sources, e.g. "v1.0.0" for git).
  string source_tag = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Defines metadata about a single field in a protobuf message.
message ProtoFieldInfo {
  // Required. Field name as defined in the .proto file.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Field number as defined in the .proto file.
  int32 number = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Field type (e.g., "string", "int32", "message").
  string type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Field cardinality ("optional", "required", "repeated").
  string label = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required. Whether this field's type is another message (as opposed to a scalar).
  bool is_message = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}
