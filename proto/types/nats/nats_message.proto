syntax = "proto3";
package natscope.types.nats;
option go_package = "github.com/dmit-4884/natscope/proto/gen/types/nats;natspb";

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// Defines the NATS JetStream message with optional server-side protobuf decoding.
message NatsMessage {
  // Required. JetStream message sequence number.
  uint64 sequence = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. NATS subject the message was published to.
  string subject = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Publish timestamp.
  google.protobuf.Timestamp timestamp = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Message payload encoded as base64 string.
  string data_base64 = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Message payload as hexadecimal string for binary inspection.
  string data_raw_hex = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Size of the original message payload in bytes.
  int32 data_size = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. Detected content type of the payload (e.g., "json", "binary", "text").
  string content_type = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. NATS message headers as key-value pairs.
  map<string, string> headers = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Server-side decoded protobuf content as JSON string.
  optional string decoded = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Fully-qualified protobuf message type used for decoding.
  optional string decoded_type = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Error message if server-side protobuf decoding failed.
  optional string decode_error = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. JetStream stream name (only present for JetStream subscriptions).
  optional string stream = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Set when the server truncated data_base64 / decoded for preview.
  // data_size remains the original byte count. The full payload can be
  // retrieved via MessagesService.Get(sequence).
  bool truncated = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}
