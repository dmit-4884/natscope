name: Bug report
description: Something in Natscope does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Natscope version
      description: Output of `natscope version`
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Homebrew
        - Docker
        - GitHub release binary
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: "macOS 15 arm64"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server output (`LOGGER__LEVEL=debug` gives more detail). Remove credentials before posting.
      render: text
