name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install codegen tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.65.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.2
          go install github.com/planetscale/vtprotobuf/cmd/protoc-gen-go-vtproto@v0.6.1-0.20240319094008-0393e58bdf10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install node dependencies
        run: |
          npm ci
          cd web && npm ci

      - name: Generate code
        run: make proto-generate

      - name: Lint proto
        run: make proto-lint

      - name: Check proto breaking changes
        run: make proto-breaking
        continue-on-error: true

      - name: Stub embedded frontend
        run: make stub-dist

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Frontend verify
        run: make web-verify

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m
